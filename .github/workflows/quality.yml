name: Repository quality checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repository:
    name: Documentation and structure checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate required files, relative Markdown links, and SVGs
        run: python scripts/check_repository.py
      - name: Check Python syntax
        run: python -m compileall -q app.py session_state.py scripts
