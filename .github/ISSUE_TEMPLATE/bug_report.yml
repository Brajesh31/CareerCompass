name: "🐛 Bug report"
description: "Report a reproducible defect"
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "Do not include real résumés, personal data, API keys, or OAuth tokens."
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the observed behavior.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: Use synthetic example data only.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Python / OS / package versions
  - type: textarea
    id: logs
    attributes:
      label: Redacted logs
      description: Remove secrets and personal information before sharing.
