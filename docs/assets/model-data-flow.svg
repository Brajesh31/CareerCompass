<svg xmlns="http://www.w3.org/2000/svg" width="900" height="430" viewBox="0 0 900 430" role="img" aria-labelledby="t d"><title id="t">Model training and inference risks</title><desc id="d">Current notebook path shows vectorizer fit before split, a leakage issue. Correct target path splits first then fits a pipeline and persists encoder.</desc><rect width="900" height="430" rx="18" fill="#f7f8fc"/><g font-family="Arial,sans-serif" text-anchor="middle" font-size="16" stroke-width="1.5"><rect x="40" y="35" width="220" height="65" rx="10" fill="#e0f2fe" stroke="#0369a1"/><text x="150" y="74" fill="#0c2d48" stroke="none">Labeled résumé dataset</text><path d="M260 67H330" stroke="#64748b"/><path d="M322 60L332 67L322 74" fill="none" stroke="#64748b"/><rect x="335" y="35" width="230" height="65" rx="10" fill="#fee2e2" stroke="#b91c1c"/><text x="450" y="62" fill="#7f1d1d" stroke="none">Fit TF-IDF on all rows</text><text x="450" y="83" fill="#7f1d1d" stroke="none" font-size="12">Current notebook, leakage</text><path d="M565 67H625V145" fill="none" stroke="#64748b"/><path d="M618 137L625 147L632 137" fill="none" stroke="#64748b"/><rect x="525" y="150" width="200" height="60" rx="10" fill="#fff7ed" stroke="#c2410c"/><text x="625" y="185" fill="#7c2d12" stroke="none">Split after transform</text><text x="625" y="235" fill="#b91c1c" stroke="none" font-size="14">Not a clean held-out evaluation</text><rect x="40" y="300" width="220" height="65" rx="10" fill="#dcfce7" stroke="#15803d"/><text x="150" y="338" fill="#14532d" stroke="none">Split rows first</text><path d="M260 332H330" stroke="#15803d"/><path d="M322 325L332 332L322 339" fill="none" stroke="#15803d"/><rect x="335" y="300" width="230" height="65" rx="10" fill="#dcfce7" stroke="#15803d"/><text x="450" y="328" fill="#14532d" stroke="none">Fit pipeline on train</text><text x="450" y="349" fill="#14532d" stroke="none" font-size="12">TF-IDF + estimator</text><path d="M565 332H625" stroke="#15803d"/><path d="M617 325L627 332L617 339" fill="none" stroke="#15803d"/><rect x="630" y="300" width="230" height="65" rx="10" fill="#dcfce7" stroke="#15803d"/><text x="745" y="328" fill="#14532d" stroke="none">Evaluate held-out test</text><text x="745" y="349" fill="#14532d" stroke="none" font-size="12">Persist label encoder too</text></g></svg>