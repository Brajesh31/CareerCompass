<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="280" viewBox="0 0 1100 280" role="img" aria-labelledby="t d"><title id="t">Career Compass application flow</title><desc id="d">OAuth gate leads to resume upload, text decoding, cleaning, TF-IDF, classifier, category mapping, external job search, and displayed results.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#53657a"/></marker></defs><rect width="1100" height="280" rx="18" fill="#f5f7fb"/><g font-family="Arial,sans-serif" font-size="15" text-anchor="middle" fill="#132238" stroke="#53657a" stroke-width="1.6"><g fill="#e8efff"><rect x="20" y="95" width="120" height="70" rx="10"/><rect x="175" y="95" width="120" height="70" rx="10"/><rect x="330" y="95" width="120" height="70" rx="10"/><rect x="485" y="95" width="120" height="70" rx="10"/><rect x="640" y="95" width="120" height="70" rx="10"/></g><g fill="#fff0dc"><rect x="795" y="95" width="120" height="70" rx="10"/><rect x="950" y="95" width="130" height="70" rx="10"/></g><g stroke="none"><text x="80" y="125">Google OAuth</text><text x="80" y="145">gate</text><text x="235" y="125">Upload</text><text x="235" y="145">TXT / PDF*</text><text x="390" y="125">Decode</text><text x="390" y="145">bytes</text><text x="545" y="125">Clean</text><text x="545" y="145">text</text><text x="700" y="125">TF-IDF +</text><text x="700" y="145">classifier</text><text x="855" y="125">Category</text><text x="855" y="145">mapping</text><text x="1015" y="125">Job API +</text><text x="1015" y="145">results</text></g><g fill="none" marker-end="url(#a)"><path d="M140 130H171"/><path d="M295 130H326"/><path d="M450 130H481"/><path d="M605 130H636"/><path d="M760 130H791"/><path d="M915 130H946"/></g><text x="550" y="225" stroke="none" fill="#9a3412" font-size="13">* Current code decodes PDF bytes as text; it does not parse PDF content.</text></g></svg>