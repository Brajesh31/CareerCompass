<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="300" viewBox="0 0 1100 300" role="img" aria-labelledby="t d"><title id="t">Repository quality workflow</title><desc id="d">A proposed change is reviewed, automated checks run, and a maintainer approves release.</desc><rect width="1100" height="300" rx="18" fill="#f5f7fb"/><g font-family="Arial,sans-serif" text-anchor="middle" font-size="15" fill="#16243a" stroke="#52657d" stroke-width="1.5"><rect x="16" y="86" width="178" height="88" rx="12" fill="#ede9fe"/><text x="105" y="122" stroke="none">Open change</text><text x="105" y="146" font-size="12" stroke="none">Issue or PR</text><path d="M194 130h36m-9 -7l9 7l-9 7" fill="none" stroke="#52657d"/><rect x="232" y="86" width="178" height="88" rx="12" fill="#e0f2fe"/><text x="321" y="122" stroke="none">Review scope</text><text x="321" y="146" font-size="12" stroke="none">Data and risk</text><path d="M410 130h36m-9 -7l9 7l-9 7" fill="none" stroke="#52657d"/><rect x="448" y="86" width="178" height="88" rx="12" fill="#ede9fe"/><text x="537" y="122" stroke="none">Run checks</text><text x="537" y="146" font-size="12" stroke="none">Tests and links</text><path d="M626 130h36m-9 -7l9 7l-9 7" fill="none" stroke="#52657d"/><rect x="664" y="86" width="178" height="88" rx="12" fill="#e0f2fe"/><text x="753" y="122" stroke="none">Human review</text><text x="753" y="146" font-size="12" stroke="none">Evidence</text><path d="M842 130h36m-9 -7l9 7l-9 7" fill="none" stroke="#52657d"/><rect x="880" y="86" width="178" height="88" rx="12" fill="#ede9fe"/><text x="969" y="122" stroke="none">Release safely</text><text x="969" y="146" font-size="12" stroke="none">Checklist</text></g><text x="550" y="238" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#8b3b16">Conceptual target flow. Proposed controls are not all implemented in the current app.</text></svg>